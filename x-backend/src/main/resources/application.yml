spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5433/iiot
    username: iiot
    password: iiot

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 19380

influx:
  url: http://localhost:8086
  org: iiot
  bucket: raw
  token: iiot-dev-admin-token

app:
  jwt:
    secret: d8rf3KBI+EEsxzl9qhl4FIq3Byvam9NI0GaYzQSuERo9xTcxYu6yJY9VJ+LRE95X
    access-token-ttl-minutes: 15
  refresh-token:
    ttl-days: 30
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  device:
    online-threshold-minutes: 5

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
