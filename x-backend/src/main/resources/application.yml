spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5433/iiot
    username: iiot
    password: iiot

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 19380

influx:
  url: http://localhost:8086
  org: iiot
  bucket: raw
  token: iiot-dev-admin-token

app:
  encryption:
    key: ${APP_ENCRYPTION_KEY:htcBFqnfOVeXpRFzOHXr3wAl1qRamivL3PBA5IC+hEY=}
  jwt:
    secret: d8rf3KBI+EEsxzl9qhl4FIq3Byvam9NI0GaYzQSuERo9xTcxYu6yJY9VJ+LRE95X
    access-token-ttl-minutes: 15
  refresh-token:
    ttl-days: 30
  cors:
    allowed-origins: http://localhost:7100,http://localhost:7200
  device:
    online-threshold-minutes: 5
  command:
    timeout-seconds: 30
  external:
    query-timeout-seconds: 10
    preview-max-rows: 50
    # Trần riêng cho mẫu dữ liệu ở trang chi tiết job: ở đó người dùng ĐỌC dữ liệu nên cần đủ
    # dòng để cuộn, khác chạy thử lúc soạn câu vốn chỉ cần biết câu chạy được hay không.
    sample-max-rows: 500

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
