# Deploy toàn bộ hệ thống: hạ tầng + 3 backend service + 2 frontend.
#
# Chạy:  scripts/deploy-prod.sh          Dừng:  scripts/down-prod.sh
# Cấu hình và secret nằm ở .env.production (root). Không hardcode gì ở đây.
#
# name: bắt buộc — tách hẳn project khỏi hạ tầng dev (industrial-enviromental-iot), nếu không
# `down` bên này sẽ coi container dev là mồ côi và xoá luôn.
name: iiot-prod

x-jvm-common: &jvm-common
  restart: unless-stopped
  environment: &jvm-env
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    INFLUX_URL: http://influxdb:8086
    INFLUX_ORG: ${INFLUX_ORG}
    INFLUX_BUCKET: ${INFLUX_BUCKET}
    INFLUX_TOKEN: ${INFLUX_TOKEN}
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    TZ: ${TZ}

services:

  # ---------------------------------------------------------------- hạ tầng

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    # maxmemory-policy noeviction: cache pin-resolve/alert-rules và cờ dedup KHÔNG được phép bị
    # đuổi ngầm — mất cờ dedup thì số đo bị xử lý lại, mất cache thì tải dồn xuống Postgres.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  emqx:
    image: emqx/emqx:5.8.0
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    ports:
      - "${MQTT_PORT}:1883"
      - "${EMQX_DASHBOARD_PORT}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12

  # Tạo topic rồi thoát. Partition là TRẦN CỨNG của số consumer và chỉ tăng được, không giảm —
  # đặt dư ngay từ đầu rẻ hơn nhiều so với nâng lúc đang chạy (xem ARCHITECTURE.md §3).
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1
          current=$$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic "$$1" \
            | grep -o 'PartitionCount: *[0-9]*' | grep -o '[0-9]*')
          if [ "$$current" -lt "$$2" ]; then
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --alter --topic "$$1" --partitions "$$2"
          fi
        }
        create sensor-data-raw   ${KAFKA_TELEMETRY_PARTITIONS}
        create external-data-raw ${KAFKA_TELEMETRY_PARTITIONS}
        create gateway-commands  ${KAFKA_COMMAND_PARTITIONS}
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  # Bật xác thực MQTT và tạo user cho 2 service.
  #
  # EMQX 5 KHÔNG có biến EMQX_ALLOW_ANONYMOUS (đó là cú pháp 4.x, đặt vào không có tác dụng gì —
  # đã kiểm chứng: client vẫn vào được với username=undefined). Bản 5 chặn ẩn danh bằng cách khai
  # một authenticator; hễ có authenticator thì kết nối không có credential hợp lệ bị từ chối.
  # Không có bước này thì bất kỳ ai chạm được cổng MQTT đều publish được dữ liệu giả và nghe trộm
  # topic lệnh điều khiển thiết bị.
  emqx-init:
    image: curlimages/curl:8.10.1
    depends_on:
      emqx:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      MQTT_SERVICE_USERNAME: ${MQTT_SERVICE_USERNAME}
      MQTT_SERVICE_PASSWORD: ${MQTT_SERVICE_PASSWORD}
    command:
      - |
        set -e
        API=http://emqx:18083/api/v5
        TOKEN=$$(curl -sf -X POST $$API/login -H 'Content-Type: application/json' \
          -d "{\"username\":\"admin\",\"password\":\"$$EMQX_DASHBOARD_PASSWORD\"}" \
          | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
        [ -n "$$TOKEN" ] || { echo "Không đăng nhập được EMQX API"; exit 1; }

        # Cả 2 lệnh dưới đây idempotent: chạy lại trên hệ thống đã cấu hình thì EMQX trả 409/400,
        # bỏ qua là đúng.
        curl -s -X POST $$API/authentication -H "Authorization: Bearer $$TOKEN" \
          -H 'Content-Type: application/json' \
          -d '{"mechanism":"password_based","backend":"built_in_database","user_id_type":"username"}' \
          -o /dev/null -w 'authenticator: %{http_code}\n' || true

        curl -s -X POST "$$API/authentication/password_based%3Abuilt_in_database/users" \
          -H "Authorization: Bearer $$TOKEN" -H 'Content-Type: application/json' \
          -d "{\"user_id\":\"$$MQTT_SERVICE_USERNAME\",\"password\":\"$$MQTT_SERVICE_PASSWORD\"}" \
          -o /dev/null -w 'service user: %{http_code}\n' || true

        echo "EMQX: đã bật xác thực. Gateway thật cần tài khoản RIÊNG + ACL, tạo trong Dashboard."

  # ---------------------------------------------------------------- backend

  # Chạy Flyway lúc khởi động nên PHẢI lên trước 2 service kia (chúng để ddl-auto=validate,
  # schema chưa có là chết ngay lúc boot).
  backend:
    <<: *jvm-common
    build:
      context: ../x-backend
    environment:
      <<: *jvm-env
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      # Quyết định có nạp db/dev-seed (admin/123456 + tenant demo) hay không — xem FLYWAY_LOCATIONS
      # trong .env.production. Để mặc định thì production KHÔNG có tài khoản test.
      SPRING_FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      influxdb: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY}

  ingestion:
    <<: *jvm-common
    build:
      context: ../x-ingestion-service
    environment:
      <<: *jvm-env
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_USERNAME: ${MQTT_SERVICE_USERNAME}
      MQTT_PASSWORD: ${MQTT_SERVICE_PASSWORD}
    depends_on:
      backend: { condition: service_healthy }
      kafka: { condition: service_healthy }
      emqx: { condition: service_healthy }
      emqx-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      # Paho chỉ có MỘT callback thread mỗi client -> ingestion KHÔNG scale bằng thread, chỉ bằng
      # số bản. Shared subscription ($share/) lo phần chia việc.
      replicas: ${INGESTION_REPLICAS}
      resources:
        limits:
          memory: ${INGESTION_MEMORY}

  processing:
    <<: *jvm-common
    build:
      context: ../x-processing-service
    environment:
      <<: *jvm-env
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_LISTENER_CONCURRENCY: ${PROCESSING_CONCURRENCY}
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_USERNAME: ${MQTT_SERVICE_USERNAME}
      MQTT_PASSWORD: ${MQTT_SERVICE_PASSWORD}
      APP_REDIS_TELEMETRY_DEDUP_TTL_HOURS: ${DEDUP_TTL_HOURS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS}
      APP_ALERT_MAIL_FROM: ${ALERT_MAIL_FROM}
    depends_on:
      backend: { condition: service_healthy }
      kafka: { condition: service_healthy }
      emqx: { condition: service_healthy }
      emqx-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      # số bản x concurrency <= số partition, nếu không bản thừa sẽ ngồi không
      replicas: ${PROCESSING_REPLICAS}
      resources:
        limits:
          # Đo thật: đỉnh ~407MB khi gánh tải với max-poll-records=500 x 8 thread.
          memory: ${PROCESSING_MEMORY}

  # ---------------------------------------------------------------- frontend

  frontend:
    build:
      context: ../x-frontend
      args:
        VITE_API_BASE_URL: ${TENANT_API_BASE_URL}
        VITE_WS_BASE_URL: ${TENANT_WS_BASE_URL}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${TENANT_WEB_PORT}:80"
    volumes:
      - ./nginx/spa.conf:/etc/nginx/conf.d/default.conf:ro

  frontend-admin:
    build:
      context: ../x-frontend-admin
      args:
        VITE_API_BASE_URL: ${ADMIN_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${ADMIN_WEB_PORT}:80"
    volumes:
      - ./nginx/spa.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  minio_data:
  emqx_data:
  emqx_log:
  kafka_data:
