# Nginx phục vụ SPA và proxy ngược /api + /ws về backend.
#
# Cùng origin với API nên frontend gọi được bằng đường dẫn tương đối (/api/v1) và KHÔNG cần
# cấu hình CORS. Riêng WebSocket vẫn phải là URL tuyệt đối vì @stomp/stompjs cần scheme ws://.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Asset của Vite có hash trong tên nên cache vĩnh viễn được; index.html thì không.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket cho realtime — bắt buộc có Upgrade/Connection, và read timeout dài vì đây là
    # kết nối giữ mở lâu, không phải request-response.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
