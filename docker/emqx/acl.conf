%% Quyền theo topic của EMQX — dùng chung DEV (compose/docker-compose.yml) và prod (docker-compose.prod.yml).
%% Luật xét từ trên xuống, gặp luật khớp đầu tiên là dừng. Xem ARCHITECTURE.md § Contract MQTT.
%%
%% Mọi gateway dùng chung tài khoản iiot-gateway, phân biệt nhau bằng Client ID = MAC: mỗi gateway chỉ gửi
%% được data/ack và chỉ nghe được command của chính MAC nó.

%% Client ID chứa ký tự wildcard bị chặn trước: ${clientid} = "+" sẽ biến luật dưới thành gateway/+/command
%% và nghe được lệnh relay của mọi gateway (đã kiểm chứng trên EMQX 5.8).
{deny, {'and', [{username, "iiot-gateway"}, {clientid, {re, "[+#/]"}}]}, all, ["#"]}.

{allow, {username, "iiot-gateway"}, publish, ["gateway/${clientid}/data", "gateway/${clientid}/ack"]}.
{allow, {username, "iiot-gateway"}, subscribe, ["gateway/${clientid}/command"]}.
{deny, {username, "iiot-gateway"}, all, ["#"]}.

%% Luật mặc định của EMQX — áp cho tài khoản service (ingestion/processing).
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.
{allow, {ipaddr, "127.0.0.1"}, all, ["$SYS/#", "#"]}.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.
{allow, all}.
