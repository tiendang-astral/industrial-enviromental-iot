spring:
  application:
    name: processing-service

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: processing-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  datasource:
    url: jdbc:postgresql://localhost:5433/iiot
    username: iiot
    password: iiot

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 19380

  # MailHog trong docker-compose (xem UI ở http://localhost:8025). Production đổi qua env.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

influx:
  url: http://localhost:8086
  org: iiot
  bucket: raw
  token: iiot-dev-admin-token

mqtt:
  broker-url: tcp://localhost:1883
  client-id: processing-service
  ack-topic-filter: gateway/+/ack

app:
  kafka:
    topic:
      sensor-data-raw: sensor-data-raw
      external-data-raw: external-data-raw
      gateway-commands: gateway-commands
  redis:
    telemetry-dedup-ttl-hours: 6
  alert:
    rule-cache-ttl-seconds: 60
    notify-pool-size: 2
    mail-from: alert@iiot.local
  command:
    outbox-poll-interval-ms: 3000
    timeout-worker-interval-ms: 5000
    mqtt-publish-max-retries: 3
    mqtt-publish-retry-delay-ms: 2000

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
