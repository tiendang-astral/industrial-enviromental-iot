spring:
  application:
    name: ingestion-service

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  datasource:
    url: jdbc:postgresql://localhost:5433/iiot
    username: iiot
    password: iiot

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 19380

mqtt:
  broker-url: tcp://localhost:1883
  client-id: ingestion-service
  # $share/<group>/ — shared subscription của EMQX: mỗi message chỉ giao cho MỘT instance
  # trong nhóm, thay vì phát bản sao cho tất cả. Tiền tố bị broker bóc trước khi giao nên
  # RECEIVED_TOPIC vẫn là gateway/{mac}/data, regex ở SensorInboundMqttHandler không đổi.
  topic-filter: $share/ingestion/gateway/+/data

app:
  kafka:
    topic:
      sensor-data-raw: sensor-data-raw
      external-data-raw: external-data-raw
  redis:
    gw-resolve-ttl-minutes: 10
  external:
    sweep-interval-ms: 15000
    query-timeout-seconds: 30
    max-rows-per-run: 500
    run-history-cleanup-interval-ms: 3600000
    # Vá lịch sử (V13) — sweep riêng để tác vụ nặng không làm trễ nhịp cron của job sống.
    backfill-sweep-interval-ms: 10000
    backfill-batch-rows: 1000
    backfill-window-hours: 24
    backfill-time-budget-ms: 60000
  encryption:
    key: ${APP_ENCRYPTION_KEY:htcBFqnfOVeXpRFzOHXr3wAl1qRamivL3PBA5IC+hEY=}

server:
  # -1 = không mở HTTP cho ứng dụng. Service này chỉ giao tiếp qua Kafka/Redis/Postgres
  # (CONVENTIONS.md §2); toàn bộ HTTP nằm ở management server bên dưới.
  port: -1

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
